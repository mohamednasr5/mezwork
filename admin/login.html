<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MezoMenu</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CRITICAL: Inline CSS for guaranteed loading -->
    <style>
        /* ===================================
           MezoMenu - Complete Inline Styles
           =================================== */
        
        :root {
            --primary-color: #ff6b35;
            --primary-dark: #e55a2b;
            --primary-light: #ff8c5a;
            --secondary-color: #f7931e;
            --accent-color: #ffb627;
            --dark-color: #1a1a2e;
            --dark-light: #16213e;
            --gray-900: #212529;
            --gray-800: #343a40;
            --gray-700: #495057;
            --gray-600: #6c757d;
            --gray-500: #adb5bd;
            --gray-400: #ced4da;
            --gray-300: #dee2e6;
            --gray-200: #e9ecef;
            --gray-100: #f8f9fa;
            --white: #ffffff;
            --success: #28a745;
            --success-light: #d4edda;
            --warning: #ffc107;
            --warning-light: #fff3cd;
            --danger: #dc3545;
            --danger-light: #f8d7da;
            --info: #17a2b8;
            --info-light: #d1ecf1;
            --whatsapp-green: #25D366;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.2);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 20px;
            --radius-full: 50%;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
        }
        
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html { scroll-behavior: smooth; font-size: 16px; }
        
        body {
            font-family: 'Cairo', sans-serif;
            line-height: 1.6;
            color: var(--gray-900);
            background-color: var(--white);
            direction: rtl;
            text-align: right;
        }
        
        [dir="rtl"] { text-align: right; }
        
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.3;
            color: var(--dark-color);
            margin-bottom: 0.5em;
        }
        
        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        h3 { font-size: 1.75rem; }
        h4 { font-size: 1.5rem; }
        
        p { margin-bottom: 1rem; color: var(--gray-700); }
        
        a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition-fast);
        }
        
        a:hover { color: var(--primary-dark); }
        
        img { max-width: 100%; height: auto; }
        
        .auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff9f5 0%, #f0f7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            display: grid;
            grid-template-columns: 480px 1fr;
            max-width: 1100px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            min-height: 700px;
        }
        
        .auth-card {
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        
        .auth-logo .logo-icon { font-size: 2rem; }
        
        .auth-logo h1 {
            font-size: 1.75rem;
            color: var(--dark-color);
            margin: 0;
        }
        
        .auth-logo h1 span { color: var(--primary-color); }
        
        .auth-header { margin-bottom: 32px; }
        
        .auth-header h2 { font-size: 1.75rem; margin-bottom: 8px; }
        
        .auth-header p { color: var(--gray-600); margin: 0; }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .form-group { margin-bottom: 1.25rem; }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--gray-700);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
            background: var(--white);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }
        
        .form-control::placeholder { color: var(--gray-500); }
        
        .input-group { position: relative; }
        
        .input-group .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
        }
        
        .input-group .form-control { padding-left: 45px; }
        
        .toggle-password {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-500);
            padding: 4px;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--gray-600);
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }
        
        .forgot-link {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-normal);
            text-decoration: none;
            white-space: nowrap;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            color: var(--white);
        }
        
        .btn-secondary {
            background: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        
        .btn-success { background: var(--whatsapp-green); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-outline { background: transparent; border: 2px solid currentColor; }
        
        .btn-lg { padding: 16px 32px; font-size: 1.125rem; }
        .btn-sm { padding: 8px 16px; font-size: 0.875rem; }
        .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: var(--radius-full); }
        .w-100 { width: 100%; }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--gray-500);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }
        
        .social-login { display: flex; justify-content: center; }
        
        .btn-social {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            background: var(--white);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .btn-social:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
        }
        
        .auth-footer p { margin: 0; color: var(--gray-600); }
        
        .auth-footer a { color: var(--primary-color); font-weight: 700; }
        
        /* Side Illustration */
        .auth-illustration {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .illustration-content {
            text-align: center;
            color: var(--white);
            position: relative;
            z-index: 1;
        }
        
        .floating-cards {
            position: relative;
            height: 280px;
            margin-bottom: 40px;
        }
        
        .float-card {
            position: absolute;
            background: rgba(255,255,255,0.95);
            color: var(--dark-color);
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            animation: floatCard 4s ease-in-out infinite;
        }
        
        .float-card i {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
        }
        
        .fc-1 { top: 20%; right: 10%; animation-delay: 0s; }
        .fc-2 { top: 45%; left: 5%; animation-delay: 1s; }
        .fc-3 { bottom: 10%; right: 25%; animation-delay: 2s; }
        
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .illustration-text h3 {
            font-size: 2rem;
            color: var(--white);
            margin-bottom: 12px;
        }
        
        .illustration-text p { opacity: 0.9; font-size: 1.1rem; }
        
        .auth-illustration::before,
        .auth-illustration::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }
        
        .auth-illustration::before {
            width: 400px; height: 400px;
            top: -100px; left: -100px;
        }
        
        .auth-illustration::after {
            width: 300px; height: 300px;
            bottom: -80px; right: -80px;
        }
        
        @media (max-width: 900px) {
            .auth-container {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            
            .auth-illustration { display: none; }
            .auth-card { padding: 32px 24px; }
        }
        
        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: var(--white);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
            border-right: 4px solid var(--primary-color);
        }
        
        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }
        .toast.warning { border-right-color: var(--warning); }
        .toast.info { border-right-color: var(--info); }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Loading Spinner */
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-text {
            margin-top: 1rem;
            color: var(--gray-600);
            font-weight: 600;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <span class="logo-icon">🍽️</span>
                <h1>Mezo<span>Menu</span></h1>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <h2>مرحباً بعودتك!</h2>
                <p>سجّل دخولك للوصول إلى لوحة تحكم مطعمك</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" class="form-control" 
                               placeholder="example@restaurant.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" checked>
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <span class="btn-loader" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <div class="divider">
                    <span>أو</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-social google" onclick="socialLogin('google')">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google
                    </button>
                </div>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
            </div>
        </div>

        <!-- Side Illustration -->
        <div class="auth-illustration">
            <div class="illustration-content">
                <div class="floating-cards">
                    <div class="float-card fc-1">
                        <i class="fas fa-utensils"></i>
                        <span>+250 صنف</span>
                    </div>
                    <div class="float-card fc-2">
                        <i class="fab fa-whatsapp"></i>
                        <span>١٥ طلب جديد</span>
                    </div>
                    <div class="float-card fc-3">
                        <i class="fas fa-chart-line"></i>
                        <span>↑ ٣٢% مبيعات</span>
                    </div>
                </div>
                <div class="illustration-text">
                    <h3>إدارة ذكية لمطعمك</h3>
                    <p>تحكم كامل في قائمتك، طلباتك، وتحليلاتك من مكان واحد</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script>
        // Simple utility functions (inline)
        const CONFIG = {
            API_URL: 'https://menu.nonm1724.workers.dev',
            FIREBASE_DB: 'https://menu-b41e6-default-rtdb.firebaseio.com'
        };

        // Storage helpers
        const Storage = {
            set: (key, value) => localStorage.setItem(key, JSON.stringify(value)),
            get: (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
            remove: (key) => localStorage.removeItem(key)
        };

        // Toast notifications
        const Toast = {
            show: (message, type = 'info') => {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = { success: 'check-circle', error: 'times-circle', warning: 'exclamation-triangle', info: 'info-circle' };
                toast.innerHTML = `<i class="fas fa-${icons[type] || 'info-circle'}"></i><span>${message}</span>`;
                
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },
            success: (msg) => Toast.show(msg, 'success'),
            error: (msg) => Toast.show(msg, 'error'),
            warning: (msg) => Toast.show(msg, 'warning'),
            info: (msg) => Toast.show(msg, 'info')
        };

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = btn.querySelector('.btn-loader');
            
            // Show loading state
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-flex';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Demo mode - allow any login
                if (email && password) {
                    const user = {
                        id: 'demo_user',
                        email: email,
                        displayName: email.split('@')[0],
                        restaurant: { name: 'مطعم تجريبي', slug: 'demo' }
                    };
                    
                    Storage.set('user_data', user);
                    Storage.set('auth_token', 'demo_token_' + Date.now());
                    
                    Toast.success('تم تسجيل الدخول بنجاح!');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    throw new Error('يرجى إدخال البريد وكلمة المرور');
                }
            } catch (error) {
                Toast.error(error.message || 'فشل تسجيل الدخول');
                
                // Reset button
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });

        // Social login handler
        function socialLogin(provider) {
            Toast.info(`تسجيل الدخول عبر ${provider} قريباً...`);
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = Storage.get('user_data');
            if (savedUser && savedUser.email) {
                console.log('User already logged in:', savedUser.email);
            }
        });
    </script>
</body>
</html>

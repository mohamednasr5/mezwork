    <!-- Add/Edit Item Modal -->
    <div class="modal-overlay" id="itemModal" style="display: none;">

            <div class="modal-header">
                <h2 id="itemModalTitle">إضافة صنف جديد</h2>
                <button onclick="closeItemModal()" class="modal-close">×</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="itemName">اسم الصنف *</label>
                            <input type="text" id="itemName" required placeholder="مثال: بيتزا مارجريتا">
                        </div>
                        
                        <div class="form-group full-width">
                            <label for="itemDescription">الوصف</label>
                            <textarea id="itemDescription" rows="3" placeholder="وصف موجز للصنف..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="itemPrice">السعر (ج.م) *</label>
                            <input type="number" id="itemPrice" required min="0" step="0.5" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="itemCategory">القسم *</label>
                            <select id="itemCategory" required>
                                <option value="">اختر القسم</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="itemEmoji">الأيقونة/الإيموجي</label>
                            <input type="text" id="itemEmoji" placeholder="🍕" maxlength="2">
                            <div class="emoji-picker">
                                <button type="button" onclick="setEmoji('🍕')">🍕</button>
                                <button type="button" onclick="setEmoji('🍔')">🍔</button>
                                <button type="button" onclick="setEmoji('🍟')">🍟</button>
                                <button type="button" onclick="setEmoji('🌮')">🌮</button>
                                <button type="button" onclick="setEmoji('🍣')">🍣</button>
                                <button type="button" onclick="setEmoji('🥗')">🥗</button>
                                <button type="button" onclick="setEmoji('🍜')">🍜</button>
                                <button type="button" onclick="setEmoji('🧁')">🧁</button>
                                <button type="button" onclick="setEmoji('☕')">☕</button>
                                <button type="button" onclick="setEmoji('🥤')">🥤</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ItemImage">صورة الصنف</label>
                            <div class="image-upload-area" onclick="document.getElementById('ItemImage').click()">
                                <input type="file" id="ItemImage" accept="image/*" onchange="previewImage(this)" hidden>
                                <div id="imagePreview" class="image-preview">
                                    <span>📷</span>
                                    <span>اضغط لرفع صورة</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="itemAvailable" checked>
                            <span>متاح للطلب</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="itemPopular">
                            <span>صنف شائع ⭐</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="itemFeatured">
                            <span>صنف مميز ✨</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <input type="hidden" id="editingItemId" value="">
                    <button type="button" onclick="closeItemModal()" class="btn btn-outline">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ الصنف</button>
                </div>
            </form>

    <!-- Service Worker Registration for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('../sw.js')
                    .then(function(registration) {
                        console.log('[PWA] Service Worker registered successfully:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('[PWA] Service Worker registration failed:', error);
                    });
            });
            
            // Handle PWA Install Prompt
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
            });
            
            window.installPWA = function() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function(choiceResult) {
                        deferredPrompt = null;
                    });
                }
            };
        }
    </script>
    
    <script>
        // Menu Editor Functions
        let currentView = 'grid';
        let items = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadCategories();
            loadItems();
        });
        
        function loadCategories() {
            const categorySelect = document.getElementById('categoryFilter');
            const itemCategorySelect = document.getElementById('itemCategory');
            
            // Load categories from Firebase or use mock data
            const categories = [
                { id: 'cat_1', name: 'المقبلات' },
                { id: 'cat_2', name: 'الأطباق الرئيسية' },
                { id: 'cat_3', name: 'المشروبات' },
                { id: 'cat_4', name: 'الحلويات' }
            ];
            
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                categorySelect.appendChild(option);
                
                const option2 = option.cloneNode(true);
                itemCategorySelect.appendChild(option2);
            });
        }
        
        function loadItems() {
            // Load items from Firebase or show mock data
            items = getMockItems();
            renderItems(items);
        }
        
        function getMockItems() {
            return [
                { id: 'item_1', name: 'بيتزا مارجريتا', description: 'صلصة طماطم، موزاريلا، ريحان', price: 85, categoryId: 'cat_2', emoji: '🍕', isAvailable: true, isPopular: true },
                { id: 'item_2', name: 'برجر لحم', description: 'لحم بقري 100%، خس، طماطم', price: 95, categoryId: 'cat_2', emoji: '🍔', isAvailable: true, isPopular: true },
                { id: 'item_3', name: 'سلطة سيزر', description: 'خس، كرانشي، بارميزان', price: 55, categoryId: 'cat_1', emoji: '🥗', isAvailable: true, isPopular: false }
            ];
        }
        
        function renderItems(itemsToRender) {
            const container = document.getElementById('itemsContainer');
            
            if (itemsToRender.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span>🍽️</span>
                        <h3>لا توجد أصناف</h3>
                        <p>جرب البحث بكلمات أخرى أو أضف صنف جديد</p>
                    </div>
                `;
                return;
            }
            
            if (currentView === 'grid') {
                container.innerHTML = `<div class="items-grid">${itemsToRender.map(item => createItemCard(item)).join('')}</div>`;
            } else {
                container.innerHTML = `<div class="items-list-view">${itemsToRender.map(item => createItemRow(item)).join('')}</div>`;
            }
        }
        
        function createItemCard(item) {
            return `
                <div class="menu-item-card ${!item.isAvailable ? 'unavailable' : ''}">
                    <div class="item-image-wrapper">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : `<span class="item-emoji-large">${item.emoji || '🍽️'}</span>`}
                        ${item.isPopular ? '<span class="item-badge popular">⭐ شائع</span>' : ''}
                        ${!item.isAvailable ? '<span class="item-badge unavailable">غير متاح</span>' : ''}
                    </div>
                    <div class="item-body">
                        <h3 class="item-name">${item.name}</h3>
                        <p class="item-description">${item.description || ''}</p>
                        <div class="item-footer">
                            <span class="item-price">${item.price} ج.م</span>
                            <div class="item-actions">
                                <button onclick="editItem('${item.id}')" class="action-btn edit" title="تعديل">✏️</button>
                                <button onclick="deleteItem('${item.id}')" class="action-btn delete" title="حذف">🗑️</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function createItemRow(item) {
            return `
                <div class="item-row ${!item.isAvailable ? 'unavailable' : ''}">
                    <div class="row-image">${item.emoji || '🍽️'}</div>
                    <div class="row-info">
                        <span class="row-name">${item.name}</span>
                        <span class="row-category">${getCategoryName(item.categoryId)}</span>
                    </div>
                    <div class="row-price">${item.price} ج.م</div>
                    <div class="row-status">${item.isAvailable ? 'متاح' : 'غير متاح'}</div>
                    <div class="row-actions">
                        <button onclick="editItem('${item.id}')" class="action-btn edit">✏️</button>
                        <button onclick="deleteItem('${item.id}')" class="action-btn delete">🗑️</button>
                    </div>
                </div>
            `;
        }
        
        function getCategoryName(categoryId) {
            const select = document.getElementById('categoryFilter');
            const option = select.querySelector(`option[value="${categoryId}"]`);
            return option ? option.textContent : 'بدون قسم';
        }
        
        function openAddItemModal() {
            document.getElementById('itemModalTitle').textContent = 'إضافة صنف جديد';
            document.getElementById('itemForm').reset();
            document.getElementById('editingItemId').value = '';
            document.getElementById('imagePreview').innerHTML = '<span>📷</span><span>اضغط لرفع صورة</span>';
            document.getElementById('itemModal').style.display = 'flex';
        }
        
        function closeItemModal() {
            document.getElementById('itemModal').style.display = 'none';
        }
        
        function editItem(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;
            
            document.getElementById('itemModalTitle').textContent = 'تعديل الصنف';
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemDescription').value = item.description || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemCategory').value = item.categoryId;
            document.getElementById('itemEmoji').value = item.emoji || '';
            document.getElementById('itemAvailable').checked = item.isAvailable;
            document.getElementById('itemPopular').checked = item.isPopular || false;
            document.getElementById('itemFeatured').checked = item.featured || false;
            document.getElementById('editingItemId').value = itemId;
            document.getElementById('itemModal').style.display = 'flex';
        }
        
        async function saveItem(e) {
            e.preventDefault();
            
            const itemId = document.getElementById('editingItemId').value;
            const itemData = {
                name: document.getElementById('itemName').value,
                description: document.getElementById('itemDescription').value,
                price: parseFloat(document.getElementById('itemPrice').value),
                categoryId: document.getElementById('itemCategory').value,
                emoji: document.getElementById('itemEmoji').value || '🍽️',
                isAvailable: document.getElementById('itemAvailable').checked,
                isPopular: document.getElementById('itemPopular').checked,
                featured: document.getElementById('itemFeatured').checked
            };
            
            if (itemId) {
                // Update existing item
                const index = items.findIndex(i => i.id === itemId);
                if (index !== -1) {
                    items[index] = { ...items[index], ...itemData };
                }
                showSuccessMessage('تم تحديث الصنف بنجاح');
            } else {
                // Add new item
                const newItem = { ...itemData, id: 'item_' + Date.now() };
                items.push(newItem);
                showSuccessMessage('تم إضافة الصنف بنجاح');
            }
            
            closeItemModal();
            renderItems(filterAndSearchItems());
        }
        
        function deleteItem(itemId) {
            if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
            
            items = items.filter(i => i.id !== itemId);
            renderItems(filterAndSearchItems());
            showErrorMessage('تم حذف الصنف');
        }
        
        function filterItems() {
            renderItems(filterAndSearchItems());
        }
        
        function searchItems(query) {
            renderItems(filterAndSearchItems(query));
        }
        
        function filterAndSearchItems(searchQuery = '') {
            const categoryId = document.getElementById('categoryFilter').value;
            let filtered = items;
            
            if (categoryId !== 'all') {
                filtered = filtered.filter(item => item.categoryId === categoryId);
            }
            
            if (searchQuery) {
                filtered = filtered.filter(item => 
                    item.name.includes(searchQuery) || 
                    (item.description && item.description.includes(searchQuery))
                );
            }
            
            return filtered;
        }
        
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-toggle button').forEach(btn => btn.classList.remove('active'));
            event.target.closest('button').classList.add('active');
            renderItems(filterAndSearchItems());
        }
        
        function setEmoji(emoji) {
            document.getElementById('itemEmoji').value = emoji;
        }
        
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        function showSuccessMessage(msg) {
            showToast(msg, 'success');
        }
        
        function showErrorMessage(msg) {
            showToast(msg, 'error');
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `✅ ${message}` : `❌ ${message}`;
            toast.style.cssText = `
                position: fixed; bottom: 20px; right: 20px;
                background: ${type === 'success' ? '#10b981' : '#ef4444'};
                color: white; padding: 16px 24px; border-radius: 12px;
                font-weight: 600; z-index: 9999; animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>

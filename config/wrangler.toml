# MezoMenu SaaS - Cloudflare Workers Configuration
# ===========================================

name = "mezomenu-api"
main = "workers/api-worker.js"
compatibility_date = "2024-01-01"

# R2 Storage Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "mezomenu-images"

# KV Namespace for rate limiting and caching
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "your_kv_namespace_id"
preview_id = "your_preview_kv_namespace_id"

# D1 Database (optional, for complex queries)
# [[d1_databases]]
# binding = "DB"
# database_name = "mezomenu-db"
# database_id = "your_database_id"

# Environment Variables (secrets)
[vars]
ENVIRONMENT = "production"
JWT_ISSUER = "mezomenu-saas"
JWT_AUDIENCE = "mezomenu-api"
NVIDIA_API_URL = "https://ai.api.nvidia.com"
FIREBASE_PROJECT_ID = "your-firebase-project-id"
PUBLIC_URL = "https://cdn.mezomenu.com"

# Secrets (set via: wrangler secret put <NAME>)
# - NVIDIA_API_KEY
# - JWT_SECRET
# - PASSWORD_SALT
# - FIREBASE_API_KEY
# - FIREBASE_DATABASE_URL

# Development configuration
[env.development]
name = "mezomenu-api-dev"

[env.staging]
name = "mezomenu-api-staging"

# Routes for custom domain
# [routes]
# pattern = "api.mezomenu.com/*"
# zone_name = "mezomenu.com"

# Domain for R2 public access
# [r2_public]
# bucket_name = "mezomenu-images"
# public_domain = "cdn.mezomenu.com"

# Limits and quotas
[limits]
cpu_ms = 50

# Build configuration
[build]
command = ""

# Triggers for scheduled jobs (e.g., cleanup tasks)
# [triggers]
# crons = ["0 0 * * *"] # Daily at midnight

# Usage Model (for billing)
# usage_model = "bundled" or "unbound"

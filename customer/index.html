<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MezoMenu - قائمة المطعم</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Customer-specific styles */
        .customer-header {
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #FF6B35 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .customer-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,107,53,0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .restaurant-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }
        
        .restaurant-name {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .restaurant-tagline {
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .customer-nav {
            background: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        .customer-categories {
            display: flex;
            gap: 12px;
            justify-content: center;
            min-width: max-content;
            padding: 0 20px;
        }
        
        .customer-category-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: 2px solid #E5E7EB;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .customer-category-btn:hover,
        .customer-category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,107,53,0.3);
        }
        
        .customer-category-btn i {
            font-size: 18px;
        }
        
        .menu-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .section-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .section-title i {
            color: var(--primary);
        }
        
        .customer-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .customer-menu-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .customer-menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        
        .customer-card-image {
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #F8F9FA, #E9ECEF);
            position: relative;
        }
        
        .customer-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .customer-menu-card:hover .customer-card-image img {
            transform: scale(1.1);
        }
        
        .card-badges {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .badge-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .badge-featured { background: linear-gradient(135deg, #FDCB6E, #F9CA24); color: #333; }
        .badge-spicy { background: linear-gradient(135deg, #FF6B6B, #EE5A5A); }
        .badge-vegetarian { background: linear-gradient(135deg, #A8E6CF, #88D8B0); color: #333; }
        .badge-unavailable { background: rgba(0,0,0,0.6); }
        
        .customer-card-body {
            padding: 22px;
        }
        
        .item-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .item-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .item-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        
        .ingredient-tag {
            padding: 4px 12px;
            background: #F3F4F6;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid #F3F4F6;
        }
        
        .item-price {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
        }
        
        .add-to-cart-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .add-to-cart-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }
        
        .cart-fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            cursor: pointer;
            font-size: 28px;
            box-shadow: 0 8px 30px rgba(255,107,53,0.4);
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cart-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(255,107,53,0.5);
        }
        
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: white;
            color: var(--primary);
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .promotions-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            margin: 40px 0;
        }
        
        .promotions-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .promotions-title {
            color: white;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .promotions-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 0;
        }
        
        .promo-card {
            min-width: 300px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .promo-discount {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 36px;
            font-weight: 900;
        }
        
        .promo-content {
            padding: 20px;
        }
        
        .promo-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .promo-code {
            display: inline-block;
            background: #F3F4F6;
            padding: 6px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
            margin-top: 10px;
        }
        
        .footer {
            background: #1A1A2E;
            color: white;
            padding: 60px 20px 30px;
            text-align: center;
        }
        
        .footer-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .footer-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
        }
        
        .footer-item i {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary);
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }
        
        .copyright {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 80px;
            color: #E5E7EB;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
        }
        
        .cart-modal.show {
            display: flex;
        }
        
        .cart-modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 24px 24px 0 0;
            animation: slideUp 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .cart-header {
            padding: 25px;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .cart-header h3 {
            font-size: 22px;
            font-weight: 700;
        }
        
        .cart-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #F3F4F6;
            cursor: pointer;
            font-size: 20px;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
        }
        
        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #F3F4F6;
        }
        
        .cart-item-image {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            background: #F3F4F6;
        }
        
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-item-details {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .cart-item-price {
            color: var(--primary);
            font-weight: 700;
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #E5E7EB;
            background: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .qty-value {
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }
        
        .cart-footer {
            padding: 25px;
            border-top: 1px solid #E5E7EB;
            background: #F9FAFB;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .total-label {
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .total-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        
        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.4);
        }
        
        @media (max-width: 768px) {
            .restaurant-name {
                font-size: 28px;
            }
            
            .customer-menu-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-info {
                flex-direction: column;
                align-items: center;
            }
            
            .cart-fab {
                bottom: 20px;
                left: 20px;
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body style="background: #F8F9FA;">
    <!-- Header -->
    <header class="customer-header" id="header">
        <div class="restaurant-logo">
            <i class="fas fa-utensils"></i>
        </div>
        <h1 class="restaurant-name" id="restaurantName">جاري التحميل...</h1>
        <p class="restaurant-tagline" id="restaurantTagline">أطيب المذاقات تنتظرك</p>
    </header>

    <!-- Categories Navigation -->
    <nav class="customer-nav" id="categoriesNav">
        <div class="customer-categories" id="categoriesContainer">
            <button class="customer-category-btn active" data-category="all" onclick="filterByCategory('all')">
                <i class="fas fa-th-large"></i>
                الكل
            </button>
        </div>
    </nav>

    <!-- Promotions Banner -->
    <section class="promotions-banner" id="promotionsBanner" style="display:none;">
        <div class="promotions-container">
            <h2 class="promotions-title"><i class="fas fa-percent"></i> عروض خاصة</h2>
            <div class="promotions-scroll" id="promotionsContainer"></div>
        </div>
    </section>

    <!-- Menu Section -->
    <main class="menu-section" id="menuSection">
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p>جاري تحميل القائمة...</p>
        </div>
        <div id="menuContainer" style="display:none;"></div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <div class="footer-content">
            <div class="footer-info">
                <div class="footer-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="footerAddress">جاري التحميل...</span>
                </div>
                <div class="footer-item">
                    <i class="fas fa-phone-alt"></i>
                    <span id="footerPhone">جاري التحميل...</span>
                </div>
                <div class="footer-item">
                    <i class="fas fa-clock"></i>
                    <span id="footerHours">جاري التحميل...</span>
                </div>
            </div>
            
            <div class="social-links" id="socialLinks">
                <a href="#" class="social-link"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
            </div>
            
            <p class="copyright">© 2024 MezoMenu. جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- Cart FAB -->
    <button class="cart-fab" id="cartFab" onclick="openCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
    </button>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h3><i class="fas fa-shopping-cart"></i> سلة التسوق</h3>
                <button class="cart-close" onclick="closeCart()">&times;</button>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="text-center text-muted">السلة فارغة</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span class="total-label">المجموع:</span>
                    <span class="total-value" id="cartTotal">$0.00</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">
                    <i class="fas fa-credit-card"></i> إتمام الطلب
                </button>
            </div>
        </div>
    </div>

    <script src="../js/firebase.js"></script>
    <script>
        // ============================================
        // Customer Page State
        // ============================================
        const CustomerState = {
            categories: [],
            menuItems: [],
            promotions: [],
            settings: null,
            selectedCategory: 'all',
            cart: []
        };

        // Firebase config for direct access (public read)
        const FIREBASE_URL = 'https://menu-b41e6-default-rtdb.firebaseio.com';

        // ============================================
        // Initialization
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCustomerData();
        });

        /**
         * Load all customer data from Firebase
         */
        async function loadCustomerData() {
            try {
                // Load settings
                const settingsRes = await fetch(`${FIREBASE_URL}/settings.json`);
                CustomerState.settings = await settingsRes.json();
                
                // Update header with restaurant info
                if (CustomerState.settings) {
                    document.getElementById('restaurantName').textContent = 
                        CustomerState.settings.restaurantName || 'MezoMenu Restaurant';
                    document.getElementById('restaurantTagline').textContent = 
                        CustomerState.settings.description || 'أطيب المذاقات تنتظرك';
                    
                    // Update footer
                    document.getElementById('footerAddress').textContent = 
                        CustomerState.settings.address || 'العنوان';
                    document.getElementById('footerPhone').textContent = 
                        CustomerState.settings.phone || 'رقم الهاتف';
                    
                    if (CustomerState.settings.workingHours) {
                        document.getElementById('footerHours').textContent = 
                            `${CustomerState.settings.workingHours.openingTime} - ${CustomerState.settings.workingHours.closingTime}`;
                    }
                }

                // Load categories
                const categoriesRes = await fetch(`${FIREBASE_URL}/categories.json`);
                const categoriesData = await categoriesRes.json();
                CustomerState.categories = categoriesData 
                    ? Object.entries(categoriesData).map(([id, cat]) => ({ id, ...cat }))
                    : [];

                // Render category buttons
                renderCategories();

                // Load menu items
                const itemsRes = await fetch(`${FIREBASE_URL}/menuItems.json`);
                const itemsData = await itemsRes.json();
                CustomerState.menuItems = itemsData 
                    ? Object.entries(itemsData).map(([id, item]) => ({ id, ...item }))
                    : [];

                // Hide loading, show menu
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('menuContainer').style.display = 'block';

                // Render menu
                renderMenuItems();

                // Load promotions
                const promosRes = await fetch(`${FIREBASE_URL}/promotions.json`);
                const promosData = await promosRes.json();
                const allPromos = promosData 
                    ? Object.entries(promosData).map(([id, promo]) => ({ id, ...promo }))
                    : [];
                
                // Filter active promotions
                const now = new Date();
                CustomerState.promotions = allPromos.filter(p => 
                    p.active && new Date(p.startDate) <= now && new Date(p.endDate) >= now
                );

                if (CustomerState.promotions.length > 0) {
                    renderPromotions();
                }

            } catch (error) {
                console.error('Error loading customer data:', error);
                document.getElementById('loadingSpinner').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>خطأ في التحميل</h3>
                        <p>يرى التحقق من اتصال الإنترنت والمحاولة مرة أخرى</p>
                    </div>
                `;
            }
        }

        /**
         * Render category navigation buttons
         */
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            
            let html = `
                <button class="customer-category-btn ${CustomerState.selectedCategory === 'all' ? 'active' : ''}" 
                        data-category="all" onclick="filterByCategory('all')">
                    <i class="fas fa-th-large"></i>
                    الكل
                </button>
            `;

            CustomerState.categories.forEach(cat => {
                html += `
                    <button class="customer-category-btn ${CustomerState.selectedCategory === cat.id ? 'active' : ''}" 
                            data-category="${cat.id}" onclick="filterByCategory('${cat.id}')">
                        <i class="fas ${cat.icon || 'fa-folder'}"></i>
                        ${cat.name}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        /**
         * Filter menu by category
         */
        function filterByCategory(categoryId) {
            CustomerState.selectedCategory = categoryId;
            
            // Update button states
            document.querySelectorAll('.customer-category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === categoryId);
            });
            
            renderMenuItems();
        }

        /**
         * Render menu items
         */
        function renderMenuItems() {
            const container = document.getElementById('menuContainer');
            
            let filteredItems = [...CustomerState.menuItems];
            
            // Filter by category
            if (CustomerState.selectedCategory !== 'all') {
                filteredItems = filteredItems.filter(item => item.categoryId === CustomerState.selectedCategory);
            }
            
            // Only show available items
            filteredItems = filteredItems.filter(item => item.available !== false);

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-utensils"></i>
                        <h3>لا توجد عناصر</h3>
                        <p>لا توجد عناصر متاحة في هذه الفئة حالياً</p>
                    </div>
                `;
                return;
            }

            // Group by category if "all" is selected
            if (CustomerState.selectedCategory === 'all') {
                let html = '';
                
                CustomerState.categories.forEach(cat => {
                    const categoryItems = filteredItems.filter(item => item.categoryId === cat.id);
                    if (categoryItems.length > 0) {
                        html += `
                            <h2 class="section-title">
                                <i class="fas ${cat.icon || 'fa-folder'}"></i>
                                ${cat.name}
                            </h2>
                            <div class="customer-menu-grid">
                                ${categoryItems.map(item => renderMenuItem(item)).join('')}
                            </div>
                        `;
                    }
                });

                // Items without category
                const uncategorizedItems = filteredItems.filter(item => !item.categoryId);
                if (uncategorizedItems.length > 0) {
                    html += `
                        <h2 class="section-title">
                            <i class="fas fa-star"></i>
                            أخرى
                        </h2>
                        <div class="customer-menu-grid">
                            ${uncategorizedItems.map(item => renderMenuItem(item)).join('')}
                        </div>
                    `;
                }

                container.innerHTML = html;
            } else {
                container.innerHTML = `
                    <div class="customer-menu-grid">
                        ${filteredItems.map(item => renderMenuItem(item)).join('')}
                    </div>
                `;
            }
        }

        /**
         * Render single menu item card
         */
        function renderMenuItem(item) {
            const category = CustomerState.categories.find(c => c.id === item.categoryId);
            
            return `
                <div class="customer-menu-card">
                    <div class="customer-card-image">
                        <img src="${item.image || 'https://via.placeholder.com/400x300?text=' + encodeURIComponent(item.name)}" 
                             alt="${item.name}"
                             onerror="this.src='https://via.placeholder.com/400x300?text=🍽️'">
                        <div class="card-badges">
                            ${item.featured ? '<span class="badge-item badge-featured">⭐ مميز</span>' : ''}
                            ${item.spicy ? '<span class="badge-item badge-spicy">🌶️ حار</span>' : ''}
                            ${item.vegetarian ? '<span class="badge-item badge-vegetarian">🥬 نباتي</span>' : ''}
                            ${item.available === false ? '<span class="badge-item badge-unavailable">غير متاح</span>' : ''}
                        </div>
                    </div>
                    <div class="customer-card-body">
                        <h3 class="item-name">${item.name}</h3>
                        <p class="item-description">${item.description || 'وصف لذيذ ومميز'}</p>
                        ${(item.ingredients && item.ingredients.length > 0) ? `
                            <div class="item-ingredients">
                                ${item.ingredients.slice(0, 4).map(ing => `<span class="ingredient-tag">${ing}</span>`).join('')}
                                ${item.ingredients.length > 4 ? `<span class="ingredient-tag">+${item.ingredients.length - 4}</span>` : ''}
                            </div>
                        ` : ''}
                        <div class="item-footer">
                            <span class="item-price">$${(item.price || 0).toFixed(2)}</span>
                            <button class="add-to-cart-btn" onclick="addToCart('${item.id}')" title="إضافة للسلة">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * Render promotions banner
         */
        function renderPromotions() {
            document.getElementById('promotionsBanner').style.display = 'block';
            const container = document.getElementById('promotionsContainer');
            
            container.innerHTML = CustomerState.promotions.map(promo => {
                let discountText = '';
                switch (promo.type) {
                    case 'percentage': discountText = `%${promo.value}`; break;
                    case 'fixed': discountText = `$${promo.value}`; break;
                    case 'bogo': discountText = '1+1'; break;
                    case 'free_delivery': discountText = 'توصيل مجاني'; break;
                    default: discountText = promo.value;
                }
                
                return `
                    <div class="promo-card">
                        <div class="promo-discount">${discountText}</div>
                        <div class="promo-content">
                            <h4 class="promo-title">${promo.title}</h4>
                            <p style="color:#6B7280;font-size:14px;">${promo.description || ''}</p>
                            ${promo.code ? `<span class="promo-code">${promo.code}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // Cart Functions
        // ============================================

        /**
         * Add item to cart
         */
        function addToCart(itemId) {
            const item = CustomerState.menuItems.find(i => i.id === itemId);
            if (!item) return;

            const existingItem = CustomerState.cart.find(ci => ci.itemId === itemId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                CustomerState.cart.push({
                    itemId: item.id,
                    name: item.name,
                    price: item.price,
                    image: item.image,
                    quantity: 1
                });
            }

            updateCartUI();
            showToast(`تمت إضافة "${item.name}" للسلة`, 'success');
        }

        /**
         * Remove item from cart
         */
        function removeFromCart(itemId) {
            CustomerState.cart = CustomerState.cart.filter(ci => ci.itemId !== itemId);
            updateCartUI();
            renderCartItems();
        }

        /**
         * Update quantity
         */
        function updateQuantity(itemId, delta) {
            const item = CustomerState.cart.find(ci => ci.itemId === itemId);
            if (!item) return;

            item.quantity += delta;
            
            if (item.quantity <= 0) {
                removeFromCart(itemId);
                return;
            }

            updateCartUI();
            renderCartItems();
        }

        /**
         * Update cart UI elements
         */
        function updateCartUI() {
            const count = CustomerState.cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = CustomerState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const countEl = document.getElementById('cartCount');
            countEl.textContent = count;
            countEl.style.display = count > 0 ? 'flex' : 'none';

            document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
        }

        /**
         * Open cart modal
         */
        function openCart() {
            document.getElementById('cartModal').classList.add('show');
            document.body.style.overflow = 'hidden';
            renderCartItems();
        }

        /**
         * Close cart modal
         */
        function closeCart() {
            document.getElementById('cartModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        /**
         * Render cart items
         */
        function renderCartItems() {
            const container = document.getElementById('cartItems');

            if (CustomerState.cart.length === 0) {
                container.innerHTML = '<p class="text-center text-muted py-4">السلة فارغة</p>';
                return;
            }

            container.innerHTML = CustomerState.cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">
                        <img src="${item.image || 'https://via.placeholder.com/70'}" alt="${item.name}"
                             onerror="this.src='https://via.placeholder.com/70?text=🍽️'">
                    </div>
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="updateQuantity('${item.itemId}', -1)">-</button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity('${item.itemId}', 1)">+</button>
                        </div>
                    </div>
                    <button class="btn-icon-text btn-danger" style="padding:4px 8px;" onclick="removeFromCart('${item.itemId}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        /**
         * Checkout (placeholder)
         */
        function checkout() {
            if (CustomerState.cart.length === 0) {
                showToast('السلة فارغة', 'warning');
                return;
            }

            const total = CustomerState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            alert(`إجمالي الطلب: $${total.toFixed(2)}\n\nهذه ميزة تجريبية. في الإنتاج، سيتم ربطها ببوابة دفع.`);
            
            // Clear cart
            CustomerState.cart = [];
            updateCartUI();
            closeCart();
        }

        /**
         * Show toast notification
         */
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 15px 30px;
                background: ${type === 'success' ? '#00B894' : type === 'warning' ? '#FDCB6E' : '#E17055'};
                color: ${type === 'warning' ? '#333' : 'white'};
                border-radius: 12px;
                font-weight: 600;
                z-index: 9999;
                animation: fadeInOut 3s forwards;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // Close cart when clicking outside
        document.getElementById('cartModal').addEventListener('click', (e) => {
            if (e.target.id === 'cartModal') closeCart();
        });
    </script>
    
    <style>
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            90% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</body>
</html>

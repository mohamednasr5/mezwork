<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل الطلبات - مطعم المبروك</title>
    <meta name="theme-color" content="#ff6b35">
    
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{
            --primary-color:#ff6b35;
            --primary-dark:#e55a2b;
            --secondary-color:#f7931e;
            --dark-color:#1a1a2e;
            --white:#ffffff;
            --gray-50:#f8f9fa;
            --gray-100:#e9ecef;
            --gray-200:#dee2e6;
            --gray-300:#ced4da;
            --gray-500:#adb5bd;
            --gray-600:#6c757d;
            --gray-700:#495057;
            --success:#28a745;
            --warning:#ffc107;
            --danger:#dc3545;
            --info:#17a2b8;
            --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
            --shadow-md:0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg:0 10px 25px rgba(0,0,0,0.15);
            --radius-sm:4px;
            --radius-md:8px;
            --radius-lg:12px;
            --radius-xl:20px;
            --radius-full:50%;
            --transition-fast:.15s ease;
            --transition-normal:.3s ease;
        }
        
        [data-theme="dark"]{
            --white:#1a1a2e;
            --gray-50:#16213e;
            --gray-100:#1f2940;
            --gray-200:#2d3f5c;
            --gray-300:#3d5068;
            --gray-500:#5a6a7e;
            --gray-600:#788898;
            --gray-700:#96a6b6;
            --dark-color:#f0f0f0;
            --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
            --shadow-md:0 4px 6px rgba(0,0,0,0.4);
            --shadow-lg:0 10px 25px rgba(0,0,0,0.5);
        }
        
        *{margin:0;padding:0;box-sizing:border-box}
        
        html{scroll-behavior:smooth}
        
        body{font-family:'Cairo',sans-serif;line-height:1.6;color:var(--dark-color);background:var(--gray-50);direction:rtl;text-align:right;min-height:100vh;padding-bottom:100px}
        
        /* Header */
        .header{background:var(--white);box-shadow:var(--shadow-md);position:sticky;top:0;z-index:100}
        .header-top{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
        .header-left{display:flex;align-items:center;gap:12px}
        .back-btn{width:40px;height:40px;border-radius:var(--radius-full);border:none;background:var(--gray-100);color:var(--gray-700);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:var(--transition-fast)}
        .back-btn:hover{background:var(--primary-color);color:#fff}
        .header-title h1{font-size:1.25rem;color:var(--dark-color);font-weight:700}
        .header-title p{font-size:.85rem;color:var(--gray-600)}
        
        /* Tabs */
        .tabs-container{background:var(--white);padding:12px 20px;display:flex;gap:10px;overflow-x:auto;border-bottom:1px solid var(--gray-100)}
        .tabs-container::-webkit-scrollbar{display:none}
        .tab-btn{padding:10px 20px;border:2px solid var(--gray-200);border-radius:var(--radius-full);background:var(--white);font-family:'Cairo',sans-serif;font-weight:600;color:var(--gray-600);cursor:pointer;white-space:nowrap;transition:var(--transition-fast)}
        .tab-btn:hover,.tab-btn.active{background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));color:#fff;border-color:transparent}
        
        /* Main Content */
        .main-content{padding:20px;max-width:600px;margin:0 auto}
        
        /* Stats Cards */
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
        .stat-card{background:var(--white);border-radius:var(--radius-lg);padding:16px;text-align:center;box-shadow:var(--shadow-sm)}
        .stat-icon{width:44px;height:44px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin:0 auto 8px}
        .stat-icon.total{background:rgba(255,107,53,.1);color:var(--primary-color)}
        .stat-icon.completed{background:rgba(40,167,69,.1);color:var(--success)}
        .stat-icon.pending{background:rgba(255,193,7,.1);color:var(--warning)}
        .stat-value{font-size:1.5rem;font-weight:800;color:var(--dark-color)}
        .stat-label{font-size:.78rem;color:var(--gray-600);margin-top:2px}
        
        /* Order Card */
        .order-card{background:var(--white);border-radius:var(--radius-xl);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--transition-normal)}
        .order-card:hover{box-shadow:var(--shadow-md)}
        .order-card-header{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-100)}
        .order-info{display:flex;flex-direction:column;gap:4px}
        .order-id{font-weight:700;color:var(--dark-color);font-size:1rem}
        .order-date{font-size:.82rem;color:var(--gray-600)}
        .order-status{padding:6px 14px;border-radius:var(--radius-full);font-size:.82rem;font-weight:700}
        .status-pending{background:rgba(255,193,7,.1);color:#856404}
        .status-preparing{background:rgba(23,162,184,.1);color:var(--info)}
        .status-delivering{background:rgba(255,107,53,.1);color:var(--primary-color)}
        .status-delivered{background:rgba(40,167,69,.1);color:var(--success)}
        .status-cancelled{background:rgba(220,53,69,.1);color:var(--danger)}
        
        .order-card-body{padding:16px}
        .order-items-preview{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
        .mini-item{display:flex;justify-content:space-between;font-size:.9rem}
        .mini-item-name{color:var(--gray-700)}
        .mini-item-qty{color:var(--gray-500)}
        
        .order-card-footer{padding:14px 16px;background:var(--gray-50);display:flex;align-items:center;justify-content:space-between}
        .order-total{font-size:1.15rem;font-weight:800;color:var(--primary-color)}
        .order-actions{display:flex;gap:8px}
        .action-btn{padding:8px 16px;border-radius:var(--radius-md);font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none;transition:var(--transition-fast);display:inline-flex;align-items:center;gap:6px}
        .action-btn-primary{background:var(--primary-color);color:#fff;border:none}
        .action-btn-primary:hover{background:var(--primary-dark)}
        .action-btn-outline{background:transparent;color:var(--primary-color);border:1px solid var(--primary-color)}
        
        /* Empty State */
        .empty-state{text-align:center;padding:60px 20px;background:var(--white);border-radius:var(--radius-xl)}
        .empty-state i{font-size:4rem;color:var(--gray-300);margin-bottom:16px}
        .empty-state h3{color:var(--gray-700);margin-bottom:8px}
        .empty-state p{color:var(--gray-500);margin-bottom:20px}
        
        /* Bottom Navigation */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);box-shadow:0 -4px 20px rgba(0,0,0,.1);display:flex;justify-content:space-around;padding:8px 0;z-index:850;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;color:var(--gray-500);text-decoration:none;transition:var(--transition-fast);font-size:.72rem;font-weight:600}
        .nav-item i{font-size:1.2rem}
        .nav-item.active,.nav-item:hover{color:var(--primary-color)}
        
        /* Toast */
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--white);padding:14px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);z-index:99999;display:flex;align-items:center;gap:10px;transition:transform .3s ease;max-width:380px;width:90%}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast-icon{width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
        .toast-success .toast-icon{background:var(--success)}
        .toast-info .toast-icon{background:var(--info)}
        .toast-text h4{font-size:.92rem;margin:0 0 2px 0;color:var(--dark-color)}
        .toast-text p{font-size:.8rem;margin:0;color:var(--gray-600)}
        
        @media(max-width:480px){
            .main-content{padding:16px}
            .stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}
            .stat-card{padding:12px}
            .stat-value{font-size:1.25rem}
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
                <div class="header-title">
                    <h1>طلباتي</h1>
                    <p>سجل جميع طلباتك</p>
                </div>
            </div>
        </div>
        
        <!-- Filter Tabs -->
        <div class="tabs-container">
            <button class="tab-btn active" data-filter="all" onclick="filterOrders('all',this)">الكل</button>
            <button class="tab-btn" data-filter="pending" onclick="filterOrders('pending',this)">قيد التنفيذ</button>
            <button class="tab-btn" data-filter="delivered" onclick="filterOrders('delivered',this)">مكتملة</button>
            <button class="tab-btn" data-filter="cancelled" onclick="filterOrders('cancelled',this)">ملغاة</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fas fa-receipt"></i></div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon completed"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="completedOrders">0</div>
                <div class="stat-label">مكتملة</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">قيد التنفيذ</div>
            </div>
        </div>

        <!-- Orders List -->
        <div id="ordersList"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a href="order-history.html" class="nav-item active">
            <i class="fas fa-receipt"></i>
            <span>طلباتي</span>
        </a>
        <a href="favorites.html" class="nav-item">
            <i class="fas fa-heart"></i>
            <span>المفضلة</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>حسابي</span>
        </a>
    </nav>

    <!-- Toast -->
    <div class="toast toast-success" id="toast">
        <div class="toast-icon"><i class="fas fa-check"></i></div>
        <div class="toast-text">
            <h4 id="toastTitle">نجاح</h4>
            <p id="toastMsg">تمت العملية بنجاح</p>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let orders = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadUserTheme();
            loadOrders();
        });

        function loadOrders() {
            // Load from localStorage
            orders = JSON.parse(localStorage.getItem('mezohistory') || '[]');
            
            // If no orders, add sample data for demo
            if (orders.length === 0) {
                orders = generateSampleOrders();
                localStorage.setItem('mezohistory', JSON.stringify(orders));
            }

            renderOrders();
            updateStats();
        }

        function generateSampleOrders() {
            const items = [
                { name: 'كبدة فراخ', price: 65 },
                { name: 'شاورما فراخ', price: 55 },
                { name: 'سلطة فتوش', price: 35 },
                { name: 'عصير برتقال', price: 18 },
                { name: 'كنافة بالنابلسي', price: 50 },
                { name: 'تكا مشوي', price: 120 }
            ];

            const statuses = ['delivered', 'delivered', 'delivered', 'cancelled', 'preparing'];
            
            return Array.from({ length: 8 }, (_, i) => ({
                id: 10042 - i,
                items: [
                    { ...items[i % items.length], qty: Math.floor(Math.random() * 3) + 1 },
                    { ...items[(i + 1) % items.length], qty: 1 }
                ],
                total: Math.floor(Math.random() * 300) + 80,
                date: new Date(Date.now() - (i * 86400000)).toISOString(),
                status: statuses[i] || 'delivered'
            }));
        }

        function renderOrders() {
            const container = document.getElementById('ordersList');
            
            const filteredOrders = currentFilter === 'all' 
                ? orders 
                : orders.filter(o => o.status === currentFilter);

            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>لا توجد طلبات</h3>
                        <p>${currentFilter === 'all' ? 'لم تقم بأي طلب بعد' : `لا توجد طلبات ${getFilterName(currentFilter)}`}</p>
                        <a href="index.html" class="action-btn action-btn-primary" style="margin-top:16px">
                            <i class="fas fa-utensils"></i> اطلب الآن
                        </a>
                    </div>`;
                return;
            }

            container.innerHTML = filteredOrders.map(order => createOrderCard(order)).join('');
        }

        function createOrderCard(order) {
            const date = new Date(order.date);
            const statusText = getStatusText(order.status);
            const statusClass = `status-${order.status}`;
            
            const itemsPreview = order.items.slice(0, 3).map(item => `
                <div class="mini-item">
                    <span class="mini-item-name">${item.name}</span>
                    <span class="mini-item-qty">${item.qty}x</span>
                </div>
            `).join('');
            
            const moreItems = order.items.length > 3 ? `<div class="mini-item"><span class="mini-item-name" style="color:var(--gray-500)">+ ${order.items.length - 3} أصناف أخرى</span></div>` : '';

            return `
                <div class="order-card" data-status="${order.status}">
                    <div class="order-card-header">
                        <div class="order-info">
                            <span class="order-id">#${order.id}</span>
                            <span class="order-date">${date.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} - ${date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                        <span class="order-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-card-body">
                        <div class="order-items-preview">
                            ${itemsPreview}
                            ${moreItems}
                        </div>
                    </div>
                    <div class="order-card-footer">
                        <span class="order-total">${order.total} ج.م</span>
                        <div class="order-actions">
                            ${order.status === 'preparing' || order.status === 'delivering' ? `
                                <a href="order-tracking.html?id=${order.id}" class="action-btn action-btn-primary">
                                    <i class="fas fa-map-marker-alt"></i> تتبع
                                </a>
                            ` : ''}
                            <button onclick="reorder(${order.id})" class="action-btn action-btn-outline">
                                <i class="fas fa-redo"></i> إعادة
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        function filterOrders(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOrders();
        }

        function updateStats() {
            const total = orders.length;
            const completed = orders.filter(o => o.status === 'delivered').length;
            const pending = orders.filter(o => o.status === 'pending' || o.status === 'preparing' || o.status === 'delivering').length;

            animateNumber('totalOrders', total);
            animateNumber('completedOrders', completed);
            animateNumber('pendingOrders', pending);
        }

        function animateNumber(elementId, target) {
            const el = document.getElementById(elementId);
            let current = 0;
            const step = target / 20;
            const timer = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.textContent = Math.floor(current);
            }, 30);
        }

        function getStatusText(status) {
            const texts = {
                pending: 'قيد الانتظار',
                preparing: 'جاري التحضير',
                delivering: 'في الطريق',
                delivered: 'تم التسليم',
                cancelled: 'ملغي'
            };
            return texts[status] || status;
        }

        function getFilterName(filter) {
            const names = {
                all: '',
                pending: 'قيد التنفيذ',
                delivered: 'مكتملة',
                cancelled: 'ملغاة'
            };
            return names[filter] || '';
        }

        function reorder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            // Add items to cart
            let cart = JSON.parse(localStorage.getItem('mezocart') || '[]');
            
            order.items.forEach(item => {
                const existingIndex = cart.findIndex(c => c.id === item.name);
                if (existingIndex > -1) {
                    cart[existingIndex].qty += item.qty;
                } else {
                    cart.push({
                        id: item.name,
                        name: item.name,
                        price: item.price,
                        qty: item.qty,
                        image: null,
                        notes: '',
                        size: null,
                        addons: []
                    });
                }
            });

            localStorage.setItem('mezocart', JSON.stringify(cart));
            showToast('تمت الإضافة!', 'تم إضافة عناصر الطلب للسلة', 'success');
            
            setTimeout(() => window.location.href = 'index.html', 1000);
        }

        // Toast
        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMsg').textContent = message;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Theme
        function loadUserTheme() {
            if (localStorage.getItem('mezodark') === 'true') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قائمة المطعم - MezoMenu</title>
    <meta name="description" content="قائمة المطعم الرقمية - اطلب بسهولة">
    <meta name="theme-color" content="#DC2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="القائمة">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest-menu.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body class="menu-page">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-content">
            <div class="restaurant-loader-icon">🍽️</div>
            <div class="spinner spinner-lg"></div>
            <p>جاري تحميل القائمة...</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="menu-app hidden">
        <!-- Restaurant Header -->
        <header class="menu-header" id="menuHeader">
            <div class="header-cover" id="coverImage">
                <img src="" alt="" id="coverImg" onerror="this.style.display='none'">
                <div class="cover-overlay"></div>
            </div>
            
            <div class="header-content">
                <div class="restaurant-info-header">
                    <div class="restaurant-logo-small" id="logoSmall">
                        <img src="" alt="شعار" id="logoImg" onerror="this.parentElement.innerHTML='<span>M</span>'">
                    </div>
                    <div class="restaurant-name-container">
                        <h1 id="restaurantName">اسم المطعم</h1>
                        <p class="restaurant-description" id="restaurantDesc"></p>
                    </div>
                </div>

                <!-- Quick Actions Bar -->
                <div class="quick-actions-bar">
                    <button onclick="openCart()" class="action-btn cart-btn" id="cartBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"/>
                            <circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                        <span>السلة</span>
                        <span class="badge badge-primary cart-count" id="cartCount">0</span>
                    </button>
                    
                    <button onclick="toggleFavorites()" class="action-btn favorites-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        <span>المفضلة</span>
                    </button>
                    
                    <button onclick="shareMenu()" class="action-btn share-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                        <span>مشاركة</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Categories Navigation -->
        <nav class="categories-nav" id="categoriesNav">
            <div class="categories-scroll" id="categoriesScroll">
                <!-- Categories will be loaded here -->
            </div>
        </nav>

        <!-- Menu Items Grid -->
        <main class="menu-items-container" id="menuItemsContainer">
            <!-- Items will be loaded here -->
        </main>

        <!-- Floating Order Button (Mobile) -->
        <button onclick="openCart()" class="floating-order-btn" id="floatingOrderBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="floating-total" id="floatingTotal">0 ج.م</span>
        </button>
    </div>

    <!-- Item Detail Modal -->
    <div id="itemModal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeItemModal()"></div>
        <div class="modal-content item-modal-content">
            <button class="modal-close" onclick="closeItemModal()">&times;</button>
            
            <div class="modal-item-image" id="modalItemImage">
                <img src="" alt="" id="modalImg">
            </div>
            
            <div class="modal-item-details">
                <div class="modal-item-header">
                    <h2 id="modalItemName">اسم الصنف</h2>
                    <button onclick="toggleModalFavorite()" class="favorite-btn" id="modalFavoriteBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </button>
                </div>
                
                <p class="modal-item-description" id="modalItemDesc"></p>
                
                <div class="modal-item-price" id="modalItemPrice">0 ج.م</div>
                
                <!-- Add-ons / Variations (if any) -->
                <div class="item-addons" id="itemAddons"></div>
                
                <!-- Special Instructions -->
                <div class="special-instructions">
                    <label for="specialNotes">ملاحظات خاصة (اختياري)</label>
                    <textarea id="specialNotes" placeholder="أي طلبات خاصة..."></textarea>
                </div>
                
                <!-- Quantity Selector & Add to Cart -->
                <div class="modal-item-actions">
                    <div class="quantity-selector">
                        <button onclick="updateModalQuantity(-1)" class="qty-btn minus">−</button>
                        <input type="number" value="1" min="1" max="99" id="modalQuantity" readonly>
                        <button onclick="updateModalQuantity(1)" class="qty-btn plus">+</button>
                    </div>
                    
                    <button onclick="addToCartFromModal()" class="btn btn-primary btn-lg add-to-cart-btn">
                        أضف للسلة
                        <span id="modalTotalPrice">0 ج.م</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer/Sidebar -->
    <div id="cartDrawer" class="cart-drawer hidden">
        <div class="cart-drawer-backdrop" onclick="closeCart()"></div>
        <aside class="cart-drawer-content">
            <div class="cart-header">
                <h2>سلتك</h2>
                <button onclick="closeCart()" class="cart-close">&times;</button>
            </div>
            
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be rendered here -->
            </div>
            
            <div class="cart-empty hidden" id="cartEmpty">
                <div class="empty-cart-icon">🛒</div>
                <p>سلتك فارغة</p>
                <p class="text-muted text-sm">أضف بعض الأصناف لبدء الطلب</p>
            </div>
            
            <div class="cart-footer" id="cartFooter">
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>المجموع الفرعي:</span>
                        <span id="subtotal">0 ج.م</span>
                    </div>
                    <div class="summary-row total">
                        <span>الإجمالي:</span>
                        <span id="cartTotal">0 ج.م</span>
                    </div>
                </div>
                
                <!-- Customer Info Form -->
                <form id="orderForm" class="order-form" onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label for="customerName">الاسم *</label>
                        <input type="text" id="customerName" required placeholder="اسمك الكريم">
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">رقم الهاتف *</label>
                        <input type="tel" id="customerPhone" required placeholder="01xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label for="orderNotes">ملاحظات على الطلب</label>
                        <textarea id="orderNotes" placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-block btn-lg" id="submitOrderBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#25d366">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                        أرسل الطلب عبر واتساب
                    </button>
                </form>
            </div>
        </aside>
    </div>

    <!-- Favorites Modal -->
    <div id="favoritesModal" class="modal hidden">
        <div class="modal-backdrop" onclick="toggleFavorites()"></div>
        <div class="modal-content favorites-modal-content">
            <div class="modal-header-favorites">
                <h2>⭐ المفضلة</h2>
                <button onclick="toggleFavorites()" class="modal-close">&times;</button>
            </div>
            <div class="favorites-list" id="favoritesList">
                <!-- Favorite items will be rendered here -->
            </div>
            <div class="favorites-empty hidden" id="favoritesEmpty">
                <p>لم تضف أي أصناف للمفضلة بعد</p>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script src="/js/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - MezoMenu</title>
    <meta name="description" content="أنشئ حسابك على MezoMenu وابدأ بإدارة قائمة مطعمك الذكية">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest-admin.json">
    <meta name="theme-color" content="#DC2626">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Logo & Header -->
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <div class="logo-icon">M</div>
                <span>MezoMenu</span>
            </a>
            <h1>إنشاء حساب جديد</h1>
            <p>ابدأ رحلتك معنا في دقائق</p>
        </div>

        <!-- Plan Selection (if coming from pricing) -->
        <div id="planSelection" class="hidden">
            <div class="selected-plan-badge">
                <span>الباقة المختارة:</span>
                <strong id="selectedPlanName">المجانية</strong>
            </div>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="auth-form register-form" onsubmit="handleRegister(event)">
            <!-- Restaurant Name -->
            <div class="form-group">
                <label for="restaurantName">اسم المطعم *</label>
                <input 
                    type="text" 
                    id="restaurantName" 
                    name="restaurantName"
                    placeholder="مثال: مطعم البركة"
                    required
                    autocomplete="organization"
                >
            </div>

            <!-- Owner Name Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="name">الاسم الكامل *</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name"
                        placeholder="أحمد محمد"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone"
                        placeholder="01xxxxxxxxx"
                        autocomplete="tel"
                    >
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="example@email.com"
                    required
                    autocomplete="email"
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">كلمة المرور *</label>
                <div class="password-input">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="6 أحرف على الأقل"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="إظهار/إخفاء كلمة المرور">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                
                <!-- Password Strength Indicator -->
                <div class="password-strength">
                    <div class="strength-bars">
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                    </div>
                    <div class="strength-text"></div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور *</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword"
                    placeholder="أعد إدخال كلمة المرور"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <!-- Hidden plan field -->
            <input type="hidden" name="plan" id="planField" value="starter">

            <!-- Terms & Conditions -->
            <div class="terms-checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    أوافق على <a href="/terms.html" target="_blank">شروط الاستخدام</a> و 
                    <a href="/privacy.html" target="_blank">سياسة الخصوصية</a>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
                <span class="btn-text">إنشاء الحساب</span>
                <span class="btn-loader hidden"><div class="spinner spinner-sm"></div></span>
            </button>

            <!-- Error Message -->
            <div id="errorMessage" class="alert alert-error hidden"></div>

            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success hidden"></div>
        </form>

        <!-- Social Login Divider -->
        <div class="social-login">
            <div class="social-divider">
                <span>أو سجّل باستخدام</span>
            </div>
            
            <div class="social-buttons">
                <button type="button" class="social-btn" onclick="socialLogin('google')">
                    <svg viewBox="0 0 24 24" fill="#4285F4">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="socialLogin('apple')">
                    <svg viewBox="0 0 24 24" fill="#000">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.83-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.05zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Apple
                </button>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="auth-footer">
            <p>لديك حساب بالفعل؟ <a href="/login.html" class="btn-link">سجّل دخولك</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Check for selected plan from URL
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan');
            const planSelection = document.getElementById('planSelection');
            const planField = document.getElementById('planField');
            const selectedPlanName = document.getElementById('selectedPlanName');
            
            if (plan) {
                const planNames = {
                    'pro': 'الباقة المكثفة',
                    'basic': 'الباقة الأساسية',
                    'starter': 'الباقة الشائق'
                };
                
                if (planSelection && selectedPlanName && planField) {
                    planSelection.classList.remove('hidden');
                    selectedPlanName.textContent = planNames[plan] || 'مخصصة';
                    planField.value = plan;
                }
            }
        });

        /**
         * Handle social login
         */
        function socialLogin(provider) {
            // In production, this would redirect to OAuth provider
            console.log(`Social login with ${provider}`);
            alert(`تسجيل الدخول بـ ${provider} قريباً!`);
        }

        window.socialLogin = socialLogin;
    </script>
</body>
</html>

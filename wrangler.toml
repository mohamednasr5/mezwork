# MezoMenu - Cloudflare Workers Configuration
# Complete SaaS platform for smart restaurant menus

name = "mezomenu"
main = "workers/index.js"
compatibility_date = "2024-01-01"

# ========================================
# Environment Variables
# ========================================

[vars]
ENVIRONMENT = "production"
APP_NAME = "MezoMenu"
APP_URL = "https://mezomenu.com"

# ========================================
# Bindings
# ========================================

# R2 Storage for images
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "mezomenu-images"

# Static Assets (serves index.html, /admin/*, /css/*, /js/*, /images/*, /icons/* etc.)
# See .assetsignore in the project root for files excluded from deployment.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

# KV Namespace for caching (optional)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your_kv_id"

# D1 Database (alternative to Firebase)
# [[d1_databases]]
# binding = "DB"
# database_name = "mezomenu-db"
# database_id = "your_database_id"

# ========================================
# Secrets (Set via: wrangler secret put)
# ========================================

# Firebase Configuration
FIREBASE_API_KEY = "AIzaSyB9SyGG0MNGWU-bmMVZVJITW0bxDbbkB94"
FIREBASE_PROJECT_ID = "menu-b41e6"
FIREBASE_AUTH_DOMAIN = "menu-b41e6.firebaseapp.com"
FIREBASE_DATABASE_URL = "https://menu-b41e6-default-rtdb.firebaseio.com"

# NVIDIA AI API
# NVIDIA_API_KEY = ""

# WhatsApp API (optional)
# WHATSAPP_API_URL = ""
# WHATSAPP_API_TOKEN = ""

# ========================================
# Routes
# ========================================

# Production routes
[routes]
pattern = "api.mezomenu.com/*"
zone_name = "mezomenu.com"

# Staging routes
# [routes]
# pattern = "staging-api.mezomenu.com/*"
# zone_name = "mezomenu.com"

# ========================================
# Worker Configuration
# ========================================

[placement]
mode = "smart"

# Limits
[limits]
cpu_ms = 30000  # 30 seconds CPU time

# ========================================
# Development Settings
# ========================================

[dev]
port = 8787
local_protocol = "http"
upstream_protocol = "https"
